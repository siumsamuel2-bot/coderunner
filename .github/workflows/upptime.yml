name: Upptime

on:
  push:
    branches: [main]
  schedule:
    # Hourly uptime check
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate status / update uptime history
        uses: upptime/uptime-monitor@master
        with:
          command: 'update'
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
